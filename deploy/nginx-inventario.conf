server {
    listen 80;
    listen [::]:80;
    server_name 172.20.0.43 h9jpvhweb04;

    root /var/www/inventario;
    index index.php;

    access_log /var/log/nginx/inventario-access.log;
    error_log /var/log/nginx/inventario-error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_FPM_SOCK__;

        # A folha de contagem de um local grande passa fácil dos 60s que são o
        # padrão do fastcgi_read_timeout — era daí que vinha o 504 no meio da
        # contagem. O PHP tem o próprio teto (app_operacao_demorada) e a
        # consulta tem o dela (query_timeout, no environments.php); aqui basta
        # não cortar antes dos dois.
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        # Posição e conferência devolvem respostas grandes demais para o
        # buffer padrão, e o nginx passa a usar arquivo temporário a cada hit.
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 32k;
    }

    # Código, configuração e scripts de deploy não são servidos. Sem isto,
    # deploy/*.sh e deploy/*.sql ficam baixáveis por quem souber o caminho.
    location ~ ^/(src|config|deploy|views|docs)/ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
