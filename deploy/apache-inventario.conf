<VirtualHost *:80>
    ServerName 172.20.0.43
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/inventario

    # A folha de contagem de um local grande passa fácil dos 60s padrão — era
    # daí que vinha o timeout no meio da contagem. O PHP tem o próprio teto
    # (app_operacao_demorada) e a consulta tem o dela (query_timeout, no
    # environments.php); aqui basta não cortar antes dos dois.
    Timeout 300
    ProxyTimeout 300

    <Directory /var/www/inventario>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        DirectoryIndex index.php

        <FilesMatch \.php$>
            SetHandler application/x-httpd-php
        </FilesMatch>
    </Directory>

    # Código, configuração e scripts de deploy não são servidos. Sem isto,
    # deploy/*.sh e deploy/*.sql ficam baixáveis por quem souber o caminho.
    <DirectoryMatch "^/var/www/inventario/(src|config|deploy|views|docs)/">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/inventario-error.log
    CustomLog ${APACHE_LOG_DIR}/inventario-access.log combined
</VirtualHost>
